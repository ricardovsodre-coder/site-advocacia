areas:
  - title: "Verbas rescisórias"
    icon: |
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    href: "/areas/verbas-rescisorias"
    summary: "Saldo, aviso prévio, 13º, férias + 1/3, FGTS + 40%, seguro-desemprego. Pagamento em até 10 dias."
  - title: "Horas extras"
    icon: |
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    href: "/areas/horas-extras"
    summary: "Além da jornada: +50% no mínimo, e aumenta férias, 13º e FGTS. Banco de horas só com acordo."
  - title: "Assédio moral"
    icon: |
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    href: "/areas/assedio-moral"
    summary: "Humilhação repetida gera indenização. Anote tudo com data, hora e testemunhas."
  - title: "Sem registro"
    icon: |
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    href: "/areas/sem-registro"
    summary: "Sem carteira assinada? Se tinha horário, chefe e salário, a Justiça reconhece o vínculo."
  - title: "Justa causa"
    icon: |
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    href: "/areas/justa-causa"
    summary: "Só vale com falta grave provada. Desproporcional? A Justiça reverte e paga tudo."
  - title: "Insalubridade"
    icon: |
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    href: "/areas/insalubridade"
    summary: "Ruído, calor, químicos: 10/20/40% do salário mínimo. Periculosidade: 30% do salário. Prova = perícia."
  - title: "Acidente/doença"
    icon: |
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    href: "/areas/acidente-doenca"
    summary: "CAT imediata + 12 meses estabilidade após voltar do INSS. Indenizações + auxílio-acidente."
  - title: "Rescisão indireta"
    icon: |
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><line x1="7" y1="21" x2="7" y2="17"/></svg>
    href: "/areas/rescisao-indireta"
    summary: "Salário atrasado, FGTS não depositado, assédio. Saia recebendo tudo. NÃO peça demissão."
  - title: "Acordo coletivo"
    icon: |
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    href: "/areas/acordo-coletivo"
    summary: "Sindicatos garantem pisos, diárias, adicionais, jornadas próprias. Confira o da sua categoria."
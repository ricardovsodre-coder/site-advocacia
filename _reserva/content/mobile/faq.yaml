faqs:
  - question: "Fui demitido sem justa causa. O que devo receber?"
    answer: "Saldo de salário, aviso prévio, 13º proporcional, férias vencidas e proporcionais com 1/3, liberação do FGTS com multa de 40% e guias do seguro-desemprego. Confira tudo no TRCT antes de assinar."
    category: "rescisao"
  - question: "Qual é a jornada normal de trabalho?"
    answer: "Até 8 horas por dia e 44 por semana. Existem variações válidas: 12x36, jornada parcial e banco de horas — mas todas precisam de acordo escrito ou convenção coletiva."
    category: "jornada"
  - question: "Como funcionam as horas extras?"
    answer: "Tudo que passar da sua jornada normal é hora extra, paga com pelo menos 50% a mais. E ela aumenta o valor das férias, do 13º, do aviso prévio e do FGTS."
    category: "horas-extras"
  - question: "Como funcionam as férias?"
    answer: "A cada 12 meses de trabalho você ganha 30 dias de descanso, recebidos com 1/3 a mais no salário e pagos até 2 dias antes de sair. Quem escolhe a data é o patrão."
    category: "ferias"
  - question: "Faltei um dia sem justificar. Perco o domingo?"
    answer: "A folga você não perde — ela é garantida por lei. Mas perde o pagamento daquele domingo. Faltas demais também diminuem os dias de férias."
    category: "faltas"
  - question: "Trabalho à noite. Tenho adicional?"
    answer: "Sim. Quem trabalha entre 22h e 5h recebe 20% a mais por hora, e cada hora conta como 52 minutos e meio — ou seja, você cumpre a jornada mais rápido."
    category: "adicional-noturno"
  - question: "Tenho direito a insalubridade ou periculosidade?"
    answer: "Quem trabalha com barulho, calor, produtos químicos ou risco de vida (eletricidade, inflamáveis, vigilância armada) pode receber adicional. A prova é feita por perícia técnica."
    category: "insalubridade"
  - question: "Como funciona o contrato de experiência?"
    answer: "Dura no máximo 90 dias e pode ser prorrogado uma vez. Se o patrão mandar embora antes do fim sem motivo, ele paga metade dos dias que faltavam, além das verbas normais."
    category: "contrato"
  - question: "Trabalhei sem carteira assinada. Tenho direitos?"
    answer: "Sim. Se havia horário, chefe e pagamento, a Justiça pode reconhecer o vínculo e mandar pagar FGTS, 13º, férias e o resto do período. Guarde provas: mensagens, fotos, testemunhas."
    category: "sem-registro"
  - question: "Qual o prazo para entrar com ação trabalhista?"
    answer: "Em regra, até 2 anos após o fim do contrato, cobrando os últimos 5 anos. Passou disso, o direito prescreve — não deixe para depois."
    category: "prazo"